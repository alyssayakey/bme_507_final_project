[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cipa-python"
version = "0.1.0"
description = "Python port of FDA/CiPA uncertainty characterization and propagation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "pandas>=2.1", "numba>=0.60", "cma>=4", "matplotlib>=3.8", "statsmodels>=0.14"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cipa = "cipa.cli:main"

[tool.setuptools.packages.find]
include = ["cipa*"]

[tool.setuptools.package-data]
cipa = ["data/**/*", "licenses/*"]
cipa_beta = ["NOTICE", "README.md", "provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
